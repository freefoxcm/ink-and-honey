<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ea">
  <title>救我熊命</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23253b34'/%3E%3Cpath d='M9 26q11-25 22 0' fill='none' stroke='%23f7ca6a' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='28' r='3' fill='%23f7ca6a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=16">
  <script defer src="./levels.js?v=13"></script>
  <script defer src="./campaign.js?v=2"></script>
  <script defer src="./portrait.js?v=4"></script>
  <script defer src="./scene.js?v=8"></script>
  <script defer src="./ink-physics.js?v=10"></script>
  <script defer src="./rescue-physics.js?v=6"></script>
  <script defer src="./engine.js?v=14"></script>
  <script defer src="./art.js?v=27"></script>
  <script defer src="./audio.js"></script>
  <script defer src="./game.js?v=21"></script>
</head>
<body>
  <main class="shell">
    <section class="home" id="home-screen" aria-labelledby="home-title">
      <img class="home-art" id="home-art" src="./assets/home-chase.webp" width="900" height="1600" alt="">
      <button class="sound icon-button" id="sound" type="button" aria-pressed="false" aria-label="开启声音">
        <span class="sound-icon" aria-hidden="true">
          <span class="art-icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M11 5 6 9H3v6h3l5 4V5Z"/></svg>
            <img data-ui-art src="./assets/ui-icon-sound.webp" alt="" hidden>
          </span>
          <svg class="sound-state" viewBox="0 0 24 24" fill="none"><path id="sound-wave" d="m15 10 5 5m0-5-5 5"/></svg>
        </span>
        <span id="sound-label" class="sr-only">声音关闭</span>
      </button>
      <h1 id="home-title" class="home-title">
        <span id="title-text">救我熊命</span>
        <img id="title-art" src="./assets/home-title.webp" width="840" height="280" alt="" hidden>
      </h1>
      <button class="primary start" id="start" type="button">开始游戏</button>
    </section>
    <section class="map" id="map-screen" aria-labelledby="map-title" hidden>
      <header class="screen-bar">
        <button class="back icon-button" id="back-home" type="button" aria-label="返回首页" title="返回首页">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/><path d="M9 12h11"/></svg>
        </button>
        <h2 id="map-title" tabindex="-1">关卡地图</h2>
        <span id="overall" class="map-progress"></span>
      </header>
      <div class="map-scroll" id="map-scroll">
        <div class="map-route" id="map-route"></div>
      </div>
    </section>
    <section class="game" id="game-screen" aria-labelledby="round-title" hidden>
      <div class="stage-fit">
        <canvas id="field" width="540" height="810" tabindex="0" aria-label="画线场地。按住鼠标或手指画线。键盘用方向键移动画笔，空格落笔或收笔。" aria-describedby="round-help"></canvas>
        <p class="notice" id="notice" aria-hidden="true" hidden></p>
      </div>
      <header class="round-bar" id="round-bar">
        <button class="icon-button" id="back-map" type="button" aria-label="返回关卡地图" title="关卡地图">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/><path d="M9 12h11"/></svg>
        </button>
        <div class="sr-only">
          <p id="round-number"></p>
          <h2 id="round-title"></h2>
        </div>
        <div class="hud" id="round-hud" aria-label="本局状态">
          <div class="ink">
            <span class="art-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 3C10 7 6.5 10.3 6.5 14a5.5 5.5 0 0 0 11 0C17.5 10.3 14 7 12 3Z"/><path d="M9.4 14.3a2.6 2.6 0 0 0 2.6 2.6"/></svg>
              <img data-ui-art src="./assets/ui-icon-ink.webp" alt="" hidden>
            </span>
            <div class="meter" id="ink-meter" role="meter" aria-label="剩余墨水" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" title="剩余墨水">
              <strong id="ink-label" aria-hidden="true">100%</strong>
              <span class="meter-track" aria-hidden="true"><span id="ink-fill"></span></span>
            </div>
          </div>
          <div class="timer" title="剩余时间">
            <span class="art-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
              <img data-ui-art src="./assets/ui-icon-timer.webp" alt="" hidden>
            </span>
            <strong id="timer-label">10.0</strong><span class="sr-only">秒</span>
          </div>
        </div>
        <button class="icon-button" id="restart" type="button" aria-label="重来" title="重来">
          <span class="art-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 11a8 8 0 1 1 2 6M4 5v6h6"/></svg>
            <img data-ui-art src="./assets/ui-icon-retry.webp" alt="" hidden>
          </span>
        </button>
        <div class="round-details">
          <p class="round-rule" id="round-rule" hidden></p>
          <div class="round-waves">
            <div class="wind-indicator" id="wind-indicator" aria-label="风向" hidden>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 7h12a2 2 0 1 0-2-2M3 12h16a2 2 0 1 1-2 2M4 17h8a2 2 0 1 1-2 2"/></svg>
              <strong id="wind-arrow" aria-hidden="true">·</strong>
            </div>
            <ol class="waves" id="waves" aria-label="蜂群出发顺序"></ol>
          </div>
        </div>
        <p class="sr-only" id="round-help"></p>
      </header>
      <div class="result-scrim" id="result" hidden>
        <section class="result-card" id="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title" aria-describedby="result-copy">
          <img class="result-art result-art-win" data-ui-art src="./assets/ui-result-win.webp" width="300" height="300" alt="" hidden>
          <img class="result-art result-art-stung" data-ui-art src="./assets/ui-result-stung.webp" width="300" height="300" alt="" hidden>
          <img class="result-art result-art-loss" data-ui-art src="./assets/ui-result-loss.webp" width="300" height="300" alt="" hidden>
          <div class="result-stars" id="result-stars" aria-hidden="true"></div>
          <h2 id="result-title"></h2>
          <p id="result-copy"></p>
          <div class="result-actions">
            <button class="tool" id="result-map" type="button">关卡地图</button>
            <button class="tool" id="result-retry" type="button">再试一次</button>
            <button class="primary" id="result-next" type="button">下一关</button>
          </div>
        </section>
      </div>
    </section>
    <p class="sr-only" id="announcement" role="status"></p>
  </main>
</body>
</html>
