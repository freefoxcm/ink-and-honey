<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ea">
  <title>救我熊命</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23253b34'/%3E%3Cpath d='M9 26q11-25 22 0' fill='none' stroke='%23f7ca6a' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='28' r='3' fill='%23f7ca6a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=10">
  <script defer src="./levels.js?v=12"></script>
  <script defer src="./campaign.js?v=2"></script>
  <script defer src="./scene.js?v=6"></script>
  <script defer src="./ink-physics.js?v=8"></script>
  <script defer src="./rescue-physics.js?v=4"></script>
  <script defer src="./engine.js?v=11"></script>
  <script defer src="./art.js?v=19"></script>
  <script defer src="./audio.js"></script>
  <script defer src="./game.js?v=15"></script>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none"><path d="M9 26q11-25 22 0" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><circle cx="20" cy="27" r="3" fill="currentColor"/></svg>
        </span>
        <span>SAVE MY BEAR LIFE!</span>
      </div>
      <button class="tool sound" id="sound" type="button" aria-pressed="false" aria-label="开启声音">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path id="sound-wave" d="m15 10 5 5m0-5-5 5"/></svg>
        <span id="sound-label">声音关闭</span>
      </button>
    </header>
    <div class="intro">
      <div>
        <h1>救我熊命</h1>
        <p>小熊偷吃了蜂蜜，蜂群追来了。画一笔护住它。</p>
      </div>
      <div class="overall" aria-label="关卡进度"><span class="overall-mark" aria-hidden="true">✦</span><span id="overall"></span></div>
    </div>
    <div class="layout">
      <section class="game" aria-label="游戏">
        <div class="stage" id="game">
          <canvas id="field" width="900" height="560" tabindex="0" aria-label="画线场地。按住鼠标或手指画线。键盘用方向键移动画笔，空格落笔或收笔。" aria-describedby="round-help"></canvas>
          <div class="hud" aria-label="本局状态">
            <div class="ink">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 18 2-6L17 2l5 5-10 10-7 1Zm10-14 5 5M7 12l5 5M4 22h16"/></svg>
              <div>
                <div class="hud-copy"><span>剩余墨水</span><strong id="ink-label">100%</strong></div>
                <div class="meter" id="ink-meter" role="meter" aria-label="剩余墨水" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span id="ink-fill"></span></div>
              </div>
            </div>
            <div class="wind-indicator" id="wind-indicator" aria-label="风向" hidden><span>风</span><strong id="wind-arrow">·</strong></div>
            <div class="timer">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
              <strong id="timer-label">10.0</strong><span>秒</span>
            </div>
          </div>
          <p class="notice" id="notice" aria-hidden="true" hidden></p>
          <div class="result-scrim" id="result" hidden>
            <section class="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title" aria-describedby="result-copy">
              <div class="result-stars" id="result-stars" aria-hidden="true"></div>
              <h2 id="result-title"></h2>
              <p id="result-copy"></p>
              <div class="result-actions">
                <button class="tool" id="result-retry" type="button">再试一次</button>
                <button class="primary" id="result-next" type="button">下一关 <span aria-hidden="true">→</span></button>
              </div>
            </section>
          </div>
        </div>
        <ol class="waves" id="waves" aria-label="蜂群出发顺序"></ol>
        <div class="stage-bar">
          <p id="round-help">按住拖动来画线，松手后蜂群就会出发。</p>
          <div class="tools">
            <button class="tool" id="hint" type="button" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18h6M10 22h4M8 15a6 6 0 1 1 8 0l-1 3H9l-1-3Z"/></svg>
              <span>提示</span>
            </button>
            <button class="tool" id="restart" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2 6M4 5v6h6"/></svg>
              <span>重来</span>
            </button>
          </div>
        </div>
      </section>
      <aside class="side" aria-label="关卡与说明">
        <section class="side-card">
          <div class="chapter"><span id="round-number">第一关</span><span id="round-theme">晴日花田</span></div>
          <h2 id="round-title">第一道防线</h2>
          <p id="round-copy">让墨线两端接到草地，蜜蜂就绕不进来了。</p>
          <div class="divider"></div>
          <h3>选择关卡</h3>
          <div class="campaign-modes" role="group" aria-label="玩法">
            <button class="group-button" id="adventure-mode" type="button" aria-pressed="true">正式冒险</button>
            <button class="group-button" id="preview-mode" type="button" aria-pressed="false">丛林试玩</button>
          </div>
          <div class="groups" id="groups" role="group" aria-label="关卡组"></div>
          <p class="group-lock" id="group-lock" hidden></p>
          <nav class="rounds" id="rounds" aria-label="选择关卡"></nav>
          <div class="star-line"><span class="star-icon" aria-hidden="true">★</span><span id="best">本关尚未获得星星</span></div>
        </section>
        <section class="guide">
          <h3>怎么玩</h3>
          <ol>
            <li><span aria-hidden="true">1</span><span id="guide-draw">一笔画出防线</span></li>
            <li><span aria-hidden="true">2</span><span id="guide-release">松手，让防线落稳</span></li>
            <li><span aria-hidden="true">3</span>守到倒计时归零</li>
          </ol>
          <p>墨水用得越少，星星越多。</p>
        </section>
      </aside>
    </div>
    <p class="sr-only" id="announcement" role="status"></p>
  </main>
</body>
</html>
